<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img"><style>text{font-family:'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;fill:#d1e4d4;font-size:27px}.small{font-size:22px;fill:#aab8a8}.accent{fill:#a8ce8d;font-weight:bold}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a8ce8d"/></marker></defs><text x="540" y="52" text-anchor="middle" class="accent" style="font-size:35px">Misskey ＝ SNSをつくるソフトウェア</text><path d="M540 78V115H200V150M540 115V150M540 115H880V150" fill="none" stroke="#a8ce8d" stroke-width="4"/><rect x="55" y="155" width="290" height="145" rx="18" fill="#30382c" stroke="#789467" stroke-width="2"/><text x="200" y="212" text-anchor="middle">SNS A</text><text x="200" y="261" text-anchor="middle" class="small">Aさんが運営</text><rect x="395" y="155" width="290" height="145" rx="18" fill="#30382c" stroke="#789467" stroke-width="2"/><text x="540" y="212" text-anchor="middle">SNS B</text><text x="540" y="261" text-anchor="middle" class="small">Bさんが運営</text><rect x="735" y="155" width="290" height="145" rx="18" fill="#30382c" stroke="#789467" stroke-width="2"/><text x="880" y="212" text-anchor="middle">SNS C</text><text x="880" y="261" text-anchor="middle" class="small">Cさんが運営</text><text x="540" y="355" text-anchor="middle">同じソフトウェアでも、登録する場所は別々</text></svg>