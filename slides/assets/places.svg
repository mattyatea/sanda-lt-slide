<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img"><style>text{font-family:'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;fill:#d1e4d4;font-size:27px}.small{font-size:22px;fill:#aab8a8}.accent{fill:#a8ce8d;font-weight:bold}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a8ce8d"/></marker></defs><rect x="15" y="35" width="370" height="285" rx="22" fill="#30382c" stroke="#789467" stroke-width="2"/><rect x="695" y="35" width="370" height="285" rx="22" fill="#2b3535" stroke="#6f9897" stroke-width="2"/><text x="200" y="84" text-anchor="middle" class="accent">ゲームの話が多いSNS</text><text x="880" y="84" text-anchor="middle" class="accent">日常の話をするSNS</text><text x="200" y="123" text-anchor="middle" class="small">運営している人は、それぞれ別</text><text x="880" y="123" text-anchor="middle" class="small">運営している人は、それぞれ別</text><circle cx="200" cy="190" r="33" fill="#a8ce8d"/><text x="200" y="200" text-anchor="middle" style="fill:#252722">A</text><circle cx="880" cy="190" r="33" fill="#9cd0cf"/><text x="880" y="200" text-anchor="middle" style="fill:#252722">B</text><text x="200" y="268" text-anchor="middle">Aさんはこちらに登録</text><text x="880" y="268" text-anchor="middle">Bさんはこちらに登録</text><text x="540" y="367" text-anchor="middle" class="small">説明のための架空のSNS・人物です</text></svg>